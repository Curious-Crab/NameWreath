<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://static-res.makextool.com/scripts/js/generator-sdk/platform-sdk.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>name wreath generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --bg: #f4f7f6;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1100px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .controls {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="range"] {
            width: 100%;
        }

        input[type="text"] {
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #eee;
            border: 2px dashed #ccc;
            border-radius: 10px;
            position: relative;
            min-width: 400px;
            min-height: 400px;
            padding: 20px;
        }

        svg {
            z-index: 2;
            max-width: 100%;
            height: auto;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .btn-download {
            margin-top: 20px;
            padding: 15px 20px;
            border: none;
            border-radius: 5px;
            background: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-download:hover {
            background: #c0392b;
        }

        .btn-download:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            font-weight: bold;
            text-align: center;
        }

        @media (max-width: 850px) {
            .container {
                box-sizing: border-box;
                flex-direction: column;
                width: min(100%, 500px);
            }

            .controls {
                width: 100%;
            }

            .preview-area {
                min-width: 0;
                min-height: 0;
            }
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">🌿 name wreath generator</h1>

    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="namesInput">Names (separated by commas)</label>
                <input type="text" id="namesInput" value="John, Samantha, James, Philip, Joan, Daniel">
            </div>

            <div class="control-group">
                <label for="strokeRange">Name Thickness (mm) <span id="strokeVal">0.3</span></label>
                <input type="range" id="strokeRange" min="0" max="1" step="0.05" value="0.3">
            </div>

            <div class="control-group">
                <label for="hubRange">Name Ring Size (mm) <span id="hubVal">48</span></label>
                <input type="range" id="hubRange" min="30" max="64" step="1" value="48">
            </div>

            <div class="control-group">
                <label for="cHeartRange">Leaf Size <span id="cHeartVal">11</span>mm</label>
                <input type="range" id="cHeartRange" min="6" max="18" step="1" value="11">
            </div>

            <div class="control-group">
                <label for="oHeartRange">Leaf Count <span id="oHeartVal">24</span></label>
                <input type="range" id="oHeartRange" min="12" max="36" step="2" value="24">
            </div>

            <div class="control-group">
                <label for="oThickRange">Leaf Vein Thickness <span id="oThickVal">0.5</span>mm</label>
                <input type="range" id="oThickRange" min="0.2" max="2" step="0.1" value="0.5">
            </div>

            <div class="control-group">
                <label for="ringRange">Wreath Radius <span id="ringVal">36</span>mm</label>
                <input type="range" id="ringRange" min="28" max="42" step="1" value="36">
            </div>

            <div class="control-group">
                <label for="holeXRange">Hanger Hole Up/Down <span id="holeXVal">2</span>mm</label>
                <input type="range" id="holeXRange" min="-20" max="20" step="1" value="2">
            </div>

            <div class="control-group">
                <label for="holeYRange">Hanger Hole Left/Right <span id="holeYVal">0</span>mm</label>
                <input type="range" id="holeYRange" min="-20" max="20" step="1" value="0">
            </div>

            <div class="control-group">
                <label for="compRange">Name Compression <span id="compVal">0</span>%</label>
                <input type="range" id="compRange" min="0" max="100" step="1" value="0">
            </div>

            <div class="control-group">
                <label for="fontRange">Font Size <span id="fontVal">15</span>pt</label>
                <input type="range" id="fontRange" min="8" max="25" step="1" value="15">
            </div>

            <button class="btn-download" id="downloadButton" type="button">
                Download High-Res PNG for Image Trace
            </button>
        </div>

        <div class="preview-area">
            <div id="status-overlay">Loading Font...</div>
            <svg id="wreathSvg"
                 width="120mm"
                 height="120mm"
                 viewBox="0 0 120 120"
                 xmlns="http://www.w3.org/2000/svg"
                 fill-rule="nonzero">
                <g id="mainGroup"></g>
            </svg>
            <p style="margin-top: 10px; color: #666;">Preview: 120mm x 120mm</p>
        </div>
    </div>

    <script>
        let font = null;

        const svgEl = document.getElementById("wreathSvg");
        const mainGroup = document.getElementById("mainGroup");
        const statusOverlay = document.getElementById("status-overlay");
        const downloadButton = document.getElementById("downloadButton");

        const CONTACT_OVERLAP = 0.25;
        const FONT_URLS = [
            new URL("Playball.ttf", document.baseURI).href,
            "https://cdn.jsdelivr.net/npm/opentype.js-fonts@1.0.0/fonts/Playball.ttf"
        ];

        let fontIndex = 0;

        function loadFont() {
            opentype.load(FONT_URLS[fontIndex], function (error, loadedFont) {
                if (error) {
                    fontIndex++;

                    if (fontIndex < FONT_URLS.length) {
                        loadFont();
                    } else {
                        statusOverlay.innerHTML =
                            "Error loading font.<br>Check that Playball.ttf is beside index.html.";
                        statusOverlay.style.color = "red";
                    }

                    return;
                }

                font = loadedFont;
                statusOverlay.style.display = "none";
                render();
            });
        }

        const inputIds = [
            "namesInput",
            "strokeRange",
            "hubRange",
            "cHeartRange",
            "oHeartRange",
            "oThickRange",
            "ringRange",
            "holeXRange",
            "holeYRange",
            "compRange",
            "fontRange"
        ];

        inputIds.forEach(function (id) {
            document.getElementById(id).addEventListener("input", function () {
                updateLabels();

                if (font) {
                    render();
                }
            });
        });

        downloadButton.addEventListener("click", downloadPNG);

        function updateLabels() {
            document.getElementById("strokeVal").textContent =
                document.getElementById("strokeRange").value;
            document.getElementById("hubVal").textContent =
                document.getElementById("hubRange").value;
            document.getElementById("cHeartVal").textContent =
                document.getElementById("cHeartRange").value;
            document.getElementById("oHeartVal").textContent =
                document.getElementById("oHeartRange").value;
            document.getElementById("oThickVal").textContent =
                document.getElementById("oThickRange").value;
            document.getElementById("ringVal").textContent =
                document.getElementById("ringRange").value;
            document.getElementById("holeXVal").textContent =
                document.getElementById("holeXRange").value;
            document.getElementById("holeYVal").textContent =
                document.getElementById("holeYRange").value;
            document.getElementById("compVal").textContent =
                document.getElementById("compRange").value;
            document.getElementById("fontVal").textContent =
                document.getElementById("fontRange").value;
        }

        function getLeafPath(size) {
            const halfWidth = size * 0.38;

            return `M 0 0
                C ${size * 0.2} ${-halfWidth}, ${size * 0.72} ${-halfWidth}, ${size} 0
                C ${size * 0.72} ${halfWidth}, ${size * 0.2} ${halfWidth}, 0 0 Z`;
        }

        function appendLeaf(centerX, centerY, angle, radius, size, veinWidth) {
            const radians = angle * Math.PI / 180;
            const x = centerX + Math.cos(radians) * radius;
            const y = centerY + Math.sin(radians) * radius;
            const transform =
                `translate(${x}, ${y}) rotate(${angle}) translate(${-size / 2}, 0)`;

            const leaf = document.createElementNS("http://www.w3.org/2000/svg", "path");
            leaf.setAttribute("d", getLeafPath(size));
            leaf.setAttribute("transform", transform);
            leaf.setAttribute("fill", "black");
            mainGroup.appendChild(leaf);

            const vein = document.createElementNS("http://www.w3.org/2000/svg", "path");
            vein.setAttribute("d", `M ${size * 0.12} 0 Q ${size * 0.5} 0 ${size * 0.88} 0`);
            vein.setAttribute("transform", transform);
            vein.setAttribute("fill", "none");
            vein.setAttribute("stroke", "white");
            vein.setAttribute("stroke-width", veinWidth);
            vein.setAttribute("stroke-linecap", "round");
            mainGroup.appendChild(vein);
        }

        function appendBow(centerX, centerY, size) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            group.setAttribute("transform", `translate(${centerX}, ${centerY})`);

            const leftLoop = document.createElementNS("http://www.w3.org/2000/svg", "path");
            leftLoop.setAttribute(
                "d",
                `M 0 0 C ${-size * 0.2} ${-size * 0.45}, ${-size * 0.95} ${-size * 0.65}, ${-size} ${-size * 0.15} ` +
                `C ${-size * 1.05} ${size * 0.25}, ${-size * 0.4} ${size * 0.35}, 0 0 Z`
            );
            leftLoop.setAttribute("fill", "black");

            const rightLoop = document.createElementNS("http://www.w3.org/2000/svg", "path");
            rightLoop.setAttribute(
                "d",
                `M 0 0 C ${size * 0.2} ${-size * 0.45}, ${size * 0.95} ${-size * 0.65}, ${size} ${-size * 0.15} ` +
                `C ${size * 1.05} ${size * 0.25}, ${size * 0.4} ${size * 0.35}, 0 0 Z`
            );
            rightLoop.setAttribute("fill", "black");

            const knot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            knot.setAttribute("cx", "0");
            knot.setAttribute("cy", "0");
            knot.setAttribute("r", size * 0.18);
            knot.setAttribute("fill", "black");

            group.appendChild(leftLoop);
            group.appendChild(rightLoop);
            group.appendChild(knot);
            mainGroup.appendChild(group);
        }

        function appendHangerHole(centerX, centerY, ringRadius, leafSize, offsetX, offsetY) {
            const x = Math.max(5, Math.min(115, centerX + offsetY));
            const baseY = centerY - ringRadius - leafSize * 0.55 - 7;
            const y = Math.max(5, Math.min(115, baseY + offsetX));

            const outer = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            outer.setAttribute("cx", x);
            outer.setAttribute("cy", y);
            outer.setAttribute("r", "3.25");
            outer.setAttribute("fill", "black");
            mainGroup.appendChild(outer);

            const inner = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            inner.setAttribute("cx", x);
            inner.setAttribute("cy", y);
            inner.setAttribute("r", "1.25");
            inner.setAttribute("fill", "white");
            mainGroup.appendChild(inner);
        }

        function createOrganicCirclePath(centerX, centerY, radius, direction = 1) {
            const points = 80;
            let pathData = "";

            for (let i = 0; i <= points; i++) {
                const angle = direction * (i / points) * Math.PI * 2;
                const adjustedRadius =
                    radius +
                    Math.sin(angle * 5) * 1.2 +
                    Math.sin(angle * 11) * 0.7 +
                    Math.cos(angle * 3) * 0.5;
                const x = centerX + Math.cos(angle) * adjustedRadius;
                const y = centerY + Math.sin(angle) * adjustedRadius;

                pathData += i === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`;
            }

            return pathData + " Z";
        }

        function pathsOverlapAtShift(context, canvas, firstPixels, secondOutline,
            minX, minY, scale, shift) {
            context.setTransform(1, 0, 0, 1, 0, 0);
            context.clearRect(0, 0, canvas.width, canvas.height);

            context.setTransform(
                scale,
                0,
                0,
                scale,
                (-minX - shift) * scale,
                -minY * scale
            );
            context.fill(secondOutline, "nonzero");

            const secondPixels = context.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            ).data;

            let overlappingPixels = 0;

            for (let i = 3; i < secondPixels.length; i += 4) {
                if (firstPixels[i] > 100 && secondPixels[i] > 100) {
                    overlappingPixels++;

                    if (overlappingPixels >= 3) {
                        return true;
                    }
                }
            }

            return false;
        }

        function findJoinShift(firstPath, secondPath, fontSize) {
            if (!firstPath.commands.length || !secondPath.commands.length) {
                return 0;
            }

            const scale = 20;
            const maxShift = Math.min(fontSize * 0.6, 12);
            const step = 0.1;
            const firstBounds = firstPath.getBoundingBox();
            const secondBounds = secondPath.getBoundingBox();

            const minX = Math.min(
                firstBounds.x1,
                secondBounds.x1 - maxShift
            ) - 2;
            const maxX = Math.max(firstBounds.x2, secondBounds.x2) + 2;
            const minY = Math.min(firstBounds.y1, secondBounds.y1) - 2;
            const maxY = Math.max(firstBounds.y2, secondBounds.y2) + 2;

            const canvas = document.createElement("canvas");
            canvas.width = Math.ceil((maxX - minX) * scale);
            canvas.height = Math.ceil((maxY - minY) * scale);

            const context = canvas.getContext("2d", {
                willReadFrequently: true
            });

            if (!context || canvas.width === 0 || canvas.height === 0) {
                return CONTACT_OVERLAP;
            }

            context.fillStyle = "black";

            const firstOutline = new Path2D(firstPath.toPathData());
            const secondOutline = new Path2D(secondPath.toPathData());

            context.setTransform(
                scale,
                0,
                0,
                scale,
                -minX * scale,
                -minY * scale
            );
            context.fill(firstOutline, "nonzero");

            const firstPixels = context.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            ).data;

            let lowerBound = 0;
            let upperBound = null;

            if (pathsOverlapAtShift(
                context, canvas, firstPixels, secondOutline,
                minX, minY, scale, 0
            )) {
                return CONTACT_OVERLAP;
            }

            for (let shift = step; shift <= maxShift; shift += step) {
                if (pathsOverlapAtShift(
                    context, canvas, firstPixels, secondOutline,
                    minX, minY, scale, shift
                )) {
                    upperBound = shift;
                    break;
                }

                lowerBound = shift;
            }

            if (upperBound === null) {
                return maxShift + CONTACT_OVERLAP;
            }

            for (let i = 0; i < 5; i++) {
                const middle = (lowerBound + upperBound) / 2;

                if (pathsOverlapAtShift(
                    context, canvas, firstPixels, secondOutline,
                    minX, minY, scale, middle
                )) {
                    upperBound = middle;
                } else {
                    lowerBound = middle;
                }
            }

            return upperBound + CONTACT_OVERLAP;
        }

        function splitPathContours(path) {
            const contours = [];
            let currentContour = [];

            path.commands.forEach(function (command) {
                if (command.type === "M" && currentContour.length) {
                    contours.push(currentContour);
                    currentContour = [];
                }

                currentContour.push(command);
            });

            if (currentContour.length) {
                contours.push(currentContour);
            }

            return contours;
        }

        function getContourBounds(commands) {
            const contourPath = new opentype.Path();
            contourPath.commands = commands;
            return contourPath.getBoundingBox();
        }

        function moveContourDown(commands, distance) {
            commands.forEach(function (command) {
                ["y", "y1", "y2"].forEach(function (key) {
                    if (Number.isFinite(command[key])) {
                        command[key] += distance;
                    }
                });
            });
        }

        function lowerDottedGlyph(path) {
            const contours = splitPathContours(path);

            if (contours.length < 2) {
                return;
            }

            const bounds = contours.map(getContourBounds);
            let mainIndex = 0;

            for (let i = 1; i < bounds.length; i++) {
                const currentHeight = bounds[i].y2 - bounds[i].y1;
                const mainHeight = bounds[mainIndex].y2 - bounds[mainIndex].y1;

                if (currentHeight > mainHeight) {
                    mainIndex = i;
                }
            }

            const mainBounds = bounds[mainIndex];
            const mainHeight = mainBounds.y2 - mainBounds.y1;
            const dotIndexes = [];

            bounds.forEach(function (box, index) {
                if (index === mainIndex) return;

                const contourHeight = box.y2 - box.y1;
                const overlapsStemHorizontally =
                    box.x2 > mainBounds.x1 && box.x1 < mainBounds.x2;
                const isSmallContour = contourHeight < mainHeight * 0.35;
                const isAboveStem = box.y2 < mainBounds.y1;

                if (isSmallContour && isAboveStem && overlapsStemHorizontally) {
                    dotIndexes.push(index);
                }
            });

            if (!dotIndexes.length) {
                return;
            }

            const dotBottom = Math.max.apply(
                null,
                dotIndexes.map(function (index) {
                    return bounds[index].y2;
                })
            );
            const dropDistance =
                mainBounds.y1 - dotBottom + CONTACT_OVERLAP;

            dotIndexes.forEach(function (index) {
                moveContourDown(contours[index], dropDistance);
            });
        }

        function buildAdjustedNamePath(text, fontSize) {
            const glyphs = font.stringToGlyphs(text);
            const positions = [];
            let cursorX = 0;

            glyphs.forEach(function (glyph, index) {
                if (index > 0) {
                    const previousGlyph = glyphs[index - 1];
                    const kerning = font.getKerningValue(previousGlyph, glyph);
                    cursorX += kerning * fontSize / font.unitsPerEm;
                }

                positions.push(cursorX);
                cursorX += glyph.advanceWidth * fontSize / font.unitsPerEm;
            });

            let joinShift = 0;

            if (glyphs.length > 1) {
                const firstPath = glyphs[0].getPath(positions[0], 0, fontSize);
                const secondPath = glyphs[1].getPath(positions[1], 0, fontSize);
                joinShift = findJoinShift(firstPath, secondPath, fontSize);
            }

            const namePath = new opentype.Path();
            const characters = Array.from(text);

            glyphs.forEach(function (glyph, index) {
                const adjustedX =
                    positions[index] - (index > 0 ? joinShift : 0);
                const glyphPath = glyph.getPath(adjustedX, 0, fontSize);
                const character = (characters[index] || "").toLowerCase();

                if (character === "i" || character === "j") {
                    lowerDottedGlyph(glyphPath);
                }

                namePath.commands.push(...glyphPath.commands);
            });

            return namePath;
        }

        function appendWhitePlug(pathData, transform) {
            const plug = document.createElementNS("http://www.w3.org/2000/svg", "path");
            plug.setAttribute("d", pathData);
            plug.setAttribute("fill", "white");
            plug.setAttribute("fill-rule", "nonzero");
            plug.setAttribute("transform", transform);
            mainGroup.appendChild(plug);
        }

        function render() {
            if (!font) return;

            mainGroup.innerHTML = "";

            const names = document.getElementById("namesInput").value
                .split(",")
                .map(function (name) {
                    return name.trim();
                })
                .filter(function (name) {
                    return name !== "";
                });

            const strokeWidth = parseFloat(document.getElementById("strokeRange").value);
            const requestedNameRadius =
                parseFloat(document.getElementById("hubRange").value) / 2;
            const leafSize = parseFloat(document.getElementById("cHeartRange").value);
            const leafCount = parseInt(document.getElementById("oHeartRange").value, 10);
            const veinWidth = parseFloat(document.getElementById("oThickRange").value);
            const ringRadius = parseFloat(document.getElementById("ringRange").value);
            const holeXOff = parseFloat(document.getElementById("holeXRange").value);
            const holeYOff = parseFloat(document.getElementById("holeYRange").value);
            const fontSize = parseFloat(document.getElementById("fontRange").value);
            const compression = parseFloat(document.getElementById("compRange").value) / 100;

            const centerX = 60;
            const centerY = 60;
            const nameRadius = Math.max(
                10,
                Math.min(
                    requestedNameRadius,
                    ringRadius - leafSize * 0.55 - fontSize * 0.25 - 2
                )
            );
            const angleStep = names.length ? 360 / names.length : 0;

            const outerPath = createOrganicCirclePath(
                centerX,
                centerY,
                ringRadius + 2.2,
                1
            );
            const innerPath = createOrganicCirclePath(
                centerX,
                centerY,
                ringRadius - 2.2,
                -1
            );
            const wreathBase = document.createElementNS("http://www.w3.org/2000/svg", "path");
            wreathBase.setAttribute("d", outerPath + " " + innerPath);
            wreathBase.setAttribute("fill", "black");
            wreathBase.setAttribute("fill-rule", "nonzero");
            mainGroup.appendChild(wreathBase);

            const leafStep = 360 / leafCount;

            for (let i = 0; i < leafCount; i++) {
                const angle = -90 + i * leafStep;
                appendLeaf(centerX, centerY, angle, ringRadius, leafSize, veinWidth);
                appendLeaf(
                    centerX,
                    centerY,
                    angle + leafStep / 2 + 180,
                    ringRadius - leafSize * 0.22,
                    leafSize * 0.82,
                    veinWidth
                );
            }

            appendBow(
                centerX,
                centerY - ringRadius + leafSize * 0.45,
                Math.max(5, leafSize * 0.72)
            );
            appendHangerHole(centerX, centerY, ringRadius, leafSize, holeXOff, holeYOff);

            names.forEach(function (name, i) {
                const textPath = buildAdjustedNamePath(name, fontSize);
                const pathData = textPath.toPathData();
                const box = textPath.getBoundingBox();
                const textWidth = box.x2 - box.x1;
                const verticalMidpoint = (box.y1 + box.y2) / 2;
                const textCenterX = (box.x1 + box.x2) / 2;
                const slotWidth = names.length
                    ? 2 * Math.PI * nameRadius / names.length * 0.84
                    : textWidth;
                const fitScale = textWidth > 0
                    ? Math.min(1.15, slotWidth / textWidth)
                    : 1;
                const scaleX = fitScale * (1 - compression * 0.35);
                const midAngle = names.length === 1
                    ? -90
                    : -90 + (i + 0.5) * angleStep;
                const radians = midAngle * Math.PI / 180;
                const textX = centerX + Math.cos(radians) * nameRadius;
                const textY = centerY + Math.sin(radians) * nameRadius;
                let textRotation = midAngle + 90;

                if (textRotation > 90 && textRotation < 270) {
                    textRotation += 180;
                }

                textRotation = ((textRotation % 360) + 360) % 360;

                const transform =
                    `translate(${textX}, ${textY}) ` +
                    `rotate(${textRotation}) ` +
                    `scale(${scaleX}, 1) ` +
                    `translate(${-textCenterX}, ${-verticalMidpoint})`;

                let currentSubPath = "";

                textPath.commands.forEach(function (command) {
                    if (command.type === "M") {
                        if (currentSubPath) {
                            appendWhitePlug(currentSubPath, transform);
                        }

                        currentSubPath = `M ${command.x},${command.y} `;
                    } else if (command.type === "L") {
                        currentSubPath += `L ${command.x},${command.y} `;
                    } else if (command.type === "C") {
                        currentSubPath +=
                            `C ${command.x1},${command.y1} ` +
                            `${command.x2},${command.y2} ` +
                            `${command.x},${command.y} `;
                    } else if (command.type === "Q") {
                        currentSubPath +=
                            `Q ${command.x1},${command.y1} ` +
                            `${command.x},${command.y} `;
                    } else if (command.type === "Z") {
                        currentSubPath += "Z ";
                    }
                });

                if (currentSubPath) {
                    appendWhitePlug(currentSubPath, transform);
                }

                const namePath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                namePath.setAttribute("d", pathData);
                namePath.setAttribute("fill", "black");
                namePath.setAttribute("stroke", "black");
                namePath.setAttribute("stroke-width", (strokeWidth / scaleX).toString());
                namePath.setAttribute("fill-rule", "nonzero");
                namePath.setAttribute("transform", transform);
                mainGroup.appendChild(namePath);
            });
        }

        async function downloadPNG() {
            const size = 2400;
            const svgBlob = new Blob(
                [new XMLSerializer().serializeToString(svgEl)],
                { type: "image/svg+xml;charset=utf-8" }
            );
            const svgUrl = URL.createObjectURL(svgBlob);

            downloadButton.disabled = true;
            downloadButton.textContent = "Preparing PNG...";

            try {
                const image = new Image();
                image.src = svgUrl;
                await image.decode();

                const canvas = document.createElement("canvas");
                canvas.width = size;
                canvas.height = size;

                const context = canvas.getContext("2d");

                if (!context) {
                    throw new Error("Could not create canvas context");
                }

                context.fillStyle = "#ffffff";
                context.fillRect(0, 0, size, size);
                context.imageSmoothingEnabled = true;
                context.imageSmoothingQuality = "high";
                context.drawImage(image, 0, 0, size, size);

                const pngBlob = await new Promise(function (resolve, reject) {
                    canvas.toBlob(function (blob) {
                        if (blob) {
                            resolve(blob);
                        } else {
                            reject(new Error("PNG encoding failed"));
                        }
                    }, "image/png");
                });

                const pngUrl = URL.createObjectURL(pngBlob);
                const link = document.createElement("a");
                link.href = pngUrl;
                link.download = "namewreath-2400px.png";
                document.body.appendChild(link);
                link.click();
                link.remove();

                setTimeout(function () {
                    URL.revokeObjectURL(pngUrl);
                }, 1000);
            } catch (error) {
                console.error("PNG export failed:", error);
                alert("PNG export failed. Check the browser console for details.");
            } finally {
                URL.revokeObjectURL(svgUrl);
                downloadButton.disabled = false;
                downloadButton.textContent = "Download High-Res PNG for Image Trace";
            }
        }

        loadFont();
    </script>
